[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "akamai-edge-diagnostics-mcp"
version = "0.1.0"
description = "Model Context Protocol server wrapping the Akamai Edge Diagnostics API v1."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Akamai Edge Diagnostics MCP contributors" }]
keywords = ["akamai", "mcp", "edge-diagnostics", "model-context-protocol"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27",
    "pydantic>=2.6",
    "edgegrid-python>=2.0.0",
    "requests>=2.31",
    # SECURITY: arlDataXml in MDT responses comes from a remote source;
    # use defusedxml to block XXE / billion-laughs / external entity attacks.
    "defusedxml>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.4",
]

[project.scripts]
akamai-edge-mcp = "akamai_edge_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/akamai_edge_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
